; =================================================================
; PlatformIO Configuration for ESP-lego-loco Framework V2.0
; Modular Lego Train Control System (ESP32 / ESP32-S3 / ESP32-C3 / ESP8266)
; Includes automated ESP Web Flasher binary export
; =================================================================

[platformio]
default_envs = master
data_dir = data

[common]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = post:scripts/merge_bin.py
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINOJSON_USE_LONG_LONG=1

; =================================================================
; 1. MASTER GATEWAY FIRMWARES
; =================================================================
[env:master]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
extra_scripts = ${common.extra_scripts}
board_build.filesystem = littlefs
build_src_filter = 
    +<master/*>
    -<loco/*>
    -<track/*>
build_flags = 
    ${common.build_flags}
    -D NODE_ROLE_MASTER
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git

[env:master_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
extra_scripts = ${common.extra_scripts}
board_build.filesystem = littlefs
build_src_filter = 
    +<master/*>
    -<loco/*>
    -<track/*>
build_flags = 
    ${common.build_flags}
    -D NODE_ROLE_MASTER
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git

; =================================================================
; 2. LOCOMOTIVE FIRMWARES
; =================================================================
[env:loco_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
extra_scripts = ${common.extra_scripts}
build_src_filter = 
    +<loco/*>
    -<master/*>
    -<track/*>
build_flags = 
    ${common.build_flags}
    -D NODE_ROLE_LOCO
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    z3t0/IRremote @ ^4.4.1

[env:loco_esp32]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
extra_scripts = ${common.extra_scripts}
build_src_filter = 
    +<loco/*>
    -<master/*>
    -<track/*>
build_flags = 
    ${common.build_flags}
    -D NODE_ROLE_LOCO
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    z3t0/IRremote @ ^4.4.1

[env:loco_esp8266]
platform = espressif8266
board = d1_mini
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = 460800
extra_scripts = ${common.extra_scripts}
build_src_filter = 
    +<loco/*>
    -<master/*>
    -<track/*>
build_flags = 
    ${common.build_flags}
    -D NODE_ROLE_LOCO
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    crankyoldgit/IRremoteESP8266 @ ^2.8.6

; =================================================================
; 3. TRACK & STATION FIRMWARES
; =================================================================
[env:track]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
extra_scripts = ${common.extra_scripts}
build_src_filter = 
    +<track/*>
    -<master/*>
    -<loco/*>
build_flags = 
    ${common.build_flags}
    -D NODE_ROLE_TRACK
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9
    madhephaestus/ESP32Servo @ ^3.0.5
    z3t0/IRremote @ ^4.4.1

[env:track_esp8266]
platform = espressif8266
board = d1_mini
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = 460800
extra_scripts = ${common.extra_scripts}
build_src_filter = 
    +<track/*>
    -<master/*>
    -<loco/*>
build_flags = 
    ${common.build_flags}
    -D NODE_ROLE_TRACK
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
